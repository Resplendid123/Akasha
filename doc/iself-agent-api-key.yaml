api:
  name: iself Agent API Key 接口
  description: 创建、管理 agent 用户及其空间绑定。管理接口仅允许工作区 owner 使用普通 SSO/JWT；绑定更新必须同时提供普通 SSO Token 和 agent API Key。

authentication:
  owner:
    type: bearer
    description: 工作区 owner 的普通 Akasha access token。
  agent:
    header: x-akasha-public-key
    type: string
    description: agent API Key JWT。
  platform:
    header: x-iself-secret
    type: string
    description: 平台间共享密钥，与服务端环境变量 ISELF_API_KEY_SECRET 常量时间比对。仅用于平台侧免登录创建 agent。

endpoints:
  - method: POST
    path: /api/iself/api-keys/public/create
    auth: platform
    headers:
      x-iself-secret: 平台间共享密钥（对应 ISELF_API_KEY_SECRET）
    description: 平台间免登录创建 agent 用户及其 agent API Key。工作区自动解析（自托管取唯一工作区，云端按子域名），密钥归属到该工作区 owner。
    body:
      agent_id: string（1-100 字符，调用方保证唯一；作为 agent 用户邮箱标识段 agent-user-<agent_id>@akasha.net）
      agent_name: string（1-100 字符，agent 用户与 API Key 的显示名）
    response: 新建的 agent API Key，含一次性返回的 token、创建者(owner)信息、agentUser 信息及空的 spaces 列表。token 仅返回一次，无法二次取回。
  - method: POST
    path: /api/iself/space
    auth: agent 或 SSO
    body: {}
    response: 当前凭据可见的空间列表；agent 仅返回已绑定空间。
  - method: POST
    path: /api/iself/space-api-key/update
    auth: agent + SSO
    headers:
      x-akasha-public-key: agent API Key JWT
      x-token: 普通 SSO Token
    body:
      spaceIds: uuid[]
    response: 更新后的绑定空间列表。

errors:
  400: 空间 ID 无效、重复，或 agent API Key 名称、agent_id 为空。
  401: 凭据缺失、无效或 agent key 已轮换/删除；平台密钥（x-iself-secret）缺失或不匹配。
  403: 非 owner 管理 agent，或 SSO 用户没有目标空间管理员权限。
  404: 平台创建时未找到工作区 owner。
  409: agent API Key 名称或 agent_id 已存在。
  503: 平台创建接口未配置（未设置 ISELF_API_KEY_SECRET）。
