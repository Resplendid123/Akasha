api:
  name: iself 知识检索接口
  description: >-
    为 iself 智能体检索 Akasha 知识。请求必须同时提供 SSO/HOIDC Token 和 agent API Key，
    且只能检索该 agent API Key 已绑定的知识空间。
  method: POST
  path: /api/iself/llm-wiki/query
  contentType: application/json

authentication:
  headers:
    x-token:
      required: true
      type: string
      description: >-
        原始 SSO 访问 Token，不要添加 Bearer 前缀。系统会通过 HOIDC 校验 Token，
        并将其映射为 agent 的补充授权主体。
    x-akasha-public-key:
      required: true
      type: string
      description: >-
        agent API Key。系统会校验 request.spaceIds 中的每个空间是否都在该 key
        的绑定范围内。

request:
  body:
    required: true
    type: object
    requiredFields:
      - query
      - spaceIds
    properties:
      query:
        type: string
        required: true
        minLength: 1
        maxLength: 4000
        description: 自然语言知识问题。
      spaceIds:
        type: array
        required: true
        uniqueItems: true
        minItems: 1
        items:
          type: string
          format: uuid
        description: >-
          要检索的知识空间。每个空间都必须位于公共检索 API Key 的授权范围内。
      chatContext:
        type: array
        required: false
        maxItems: 30
        items:
          type: string
          maxLength: 4000
        description: 可选的历史对话内容，用于辅助理解当前问题。
      attachments:
        type: boolean
        required: false
        default: false
        description: >-
          传入 true 时，在响应顶层返回 attachments 列表，仅包含本次最终直接命中块内
          关联的有效非图片附件及签名下载地址，最多 5 个。未传入或传入 false 时，
          不返回 attachments 字段。该字段不受 includeCitations 影响。
      includeCitations:
        type: boolean
        required: false
        default: false
        description: >-
          是否附带引用资料，只控制 citations 相关内容。不会开启顶层 attachments 列表。
      generalKnowledgeEnabled:
        type: boolean
        required: false
        default: false
        description: >-
          传入 true 时，当授权范围内没有检索结果或结果不足时，允许回答模型使用
          通用知识兜底。iself 不会自动使用用户界面中的通用知识偏好配置。
      scoreThreshold:
        type: number
        required: false
        default: 0.45
        minimum: 0
        maximum: 2
        description: >-
          语义召回允许的最大 cosine distance。值越小，召回越严格；值越大，召回
          越宽松。该参数只影响语义候选，词法匹配和标题精确匹配仍使用原有规则。
      rawResultsOnly:
        type: boolean
        required: false
        default: false
        description: >-
          传入 true 时，跳过答案生成大模型，直接返回检索与打包后的原始结果
          （citations / retrievedSources / snippets / citationEvidence 等字段照常填充），
          此时 answer 恒为空字符串，answerMode 仅为 knowledge（有命中）或 no_match
          （无命中），且不会触发通用知识兜底（即使 generalKnowledgeEnabled 为 true）。
          适用于希望自行处理检索证据、对响应延迟敏感的调用方。查询改写仍会执行，
          除非通过 queryRewriteEnabled 显式关闭。
      queryRewriteEnabled:
        type: boolean
        required: false
        default: true
        description: >-
          是否执行大模型查询改写（将 chatContext 合并为独立的检索查询）。默认开启。
          传入 false 时跳过改写，直接使用原始 query 检索，此时响应不返回 retrievalQuery。

examples:
  request:
    headers:
      x-token: <sso 或 iself token>
      x-akasha-public-key: <公共检索 API key>
    body:
      query: 如何配置 Kafka？
      spaceIds:
        - 00000000-0000-4000-8000-000000000001
      includeCitations: true
      generalKnowledgeEnabled: false
      scoreThreshold: 0.6

response:
  status: 200
  body:
    type: object
    properties:
      answer:
        type: string
        description: >-
          答案正文。当请求参数 rawResultsOnly 为 true 时，此字段恒为空字符串。
      answerMode:
        type: string
        enum:
          - knowledge
          - no_match
          - general
        description: >-
          答案来源模式。rawResultsOnly 为 true 时只可能是 knowledge（有检索证据）
          或 no_match（无检索证据），不会出现 general。
      retrievalQuery:
        type: string
        required: false
        description: >-
          如果发生查询改写，返回实际用于检索的查询文本。当 queryRewriteEnabled 为
          false 或未发生改写时不返回该字段。
      citations:
        type: array
        items:
          $ref: '#/definitions/citation'
      citationEvidence:
        type: array
        items:
          $ref: '#/definitions/citationEvidence'
      retrievedSources:
        type: array
        items:
          $ref: '#/definitions/citation'
      snippets:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
            text:
              type: string
            retrievalReasons:
              type: array
              items:
                type: string
            sourceWindows:
              type: array
              items:
                $ref: '#/definitions/sourceWindow'
      warnings:
        type: array
        items:
          type: string
      retrievalReasons:
        type: array
        items:
          type: string
      budget:
        type: object
        properties:
          maxContextLength: { type: number }
          usedContextLength: { type: number }
          remainingContextLength: { type: number }
          includedItemCount: { type: number }
          omittedItemCount: { type: number }
          responseReserve: { type: number }
          perItemMaxLength: { type: number }
      completenessNotice:
        type: string
      attachments:
        required: false
        description: >-
          仅当请求参数 attachments 为 true 时返回。包含本次最终直接命中块内关联的
          有效非图片附件，最多 5 个；不包含同页其他位置、同步块归属附件或扩展上下文
          中的附件。sourcePageId 未必出现在模型最终选择的 citations 中。
        type: array
        maxItems: 5
        items:
          $ref: '#/definitions/attachment'

definitions:
  citation:
    type: object
    properties:
      sourcePageId: { type: string, format: uuid }
      title: { type: string }
      url: { type: string }
      images:
        type: array
        description: 引用页面关联的图片列表，可能为空。
        items:
          type: object
          properties:
            attachmentId: { type: string, format: uuid }
            fileName: { type: string }
            mimeType: { type: string }
            url: { type: string }
            description: { type: string }
  citationEvidence:
    type: object
    properties:
      sourcePageId: { type: string, format: uuid }
      title: { type: string }
      url: { type: string }
      excerpts:
        type: array
        items:
          type: object
          properties:
            text: { type: string }
            sourceRange: { type: object }
            quoteHash: { type: string }
  sourceWindow:
    type: object
    properties:
      sourcePageId: { type: string, format: uuid }
      title: { type: string }
      url: { type: string }
      text: { type: string }
      sourceRange: { type: object }
      quoteHash: { type: string }
  attachment:
    type: object
    properties:
      attachmentId: { type: string, format: uuid }
      sourcePageId: { type: string, format: uuid }
      fileName: { type: string }
      mimeType: { type: string, nullable: true }
      fileSize: { type: number, nullable: true }
      url:
        type: string
        description: 附件的签名公开下载地址。

errors:
  400:
    description: >-
      请求参数校验失败，例如 UUID、布尔值格式错误，或 scoreThreshold 超出范围。
  401:
    description: >-
      缺少或无效的 x-token、SSO 用户不是当前工作区成员，或公共 API Key 缺失/无效。
  403:
    description: >-
      工作区未启用 AI 知识问答，或请求的知识空间不在公共 API Key 的授权范围内。
